<!doctype html><meta charset="utf-8">
<style>body{background:#0f1526;color:#8b97b8;font:12px system-ui;margin:0;padding:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.c{background:#131a30;border:1px solid #222c4a;border-radius:10px;padding:6px;width:190px;text-align:center}
svg{display:block;width:100%;height:150px}
h3{color:#e8edf9;font-size:13px;margin:4px 0 8px}</style>
<div id="o"></div>
<script src="/silhouettes.js"></script>
<script src="/_outlines.js"></script>
<script>
const out=document.getElementById('o');
const probe=document.createElementNS('http://www.w3.org/2000/svg','svg');
probe.setAttribute('style','position:absolute;width:0;height:0');document.body.appendChild(probe);
function cell(parts,label,fill){
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  parts.flat().forEach(d=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);g.appendChild(p)});
  probe.appendChild(g);const b=g.getBBox();probe.removeChild(g);
  const inner=parts.flat().map(d=>`<path d="${d}"/>`).join('');
  return `<div class="c"><svg viewBox="${b.x-3} ${b.y-3} ${b.width+6} ${b.height+6}"><g fill="${fill}">${inner}</g></svg>${label}<br><span style="opacity:.6">${b.width.toFixed(0)}×${b.height.toFixed(0)}</span></div>`;
}
let html='';
for(const k in NEW){
  html+=`<h3>${k}</h3><div class="row">`+cell([SILHOUETTES[k]],'prima','#5d6888')+cell([NEW[k]],'dopo','#7da2ff')+`</div>`;
}
out.innerHTML=html;
</script>
